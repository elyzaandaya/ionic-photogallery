```yaml
name: Build Ionic Photo Gallery Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Vue application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java environment
        run: |
          java -version
          javac -version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IonicPhotogallery.apk

      - name: Upload Ionic Photo Gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicPhotogallery-APK
          path: IonicPhotogallery.apk
```
